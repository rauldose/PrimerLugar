<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Nuevo León Primer Lugar</title>
  <style>
    body { margin:0; background:#050505; color:#fff; font-family:Arial, Helvetica, sans-serif; padding:24px; }
    main { max-width:1000px; margin:0 auto; }
    a { color:#ffb37c; }
    h1 { font-size:42px; margin:0 0 8px; }
    .card { background:#151515; border:1px solid #2b2b2b; border-radius:24px; padding:18px; margin:18px 0; }
    input { width:100%; border:1px solid #3a3a3a; background:#050505; color:#fff; border-radius:14px; padding:12px; font-size:15px; }
    button { border:0; border-radius:14px; padding:10px 14px; cursor:pointer; font-weight:800; margin:4px; }
    .approve { background:#2ecc71; color:#041007; }
    .reject { background:#e74c3c; color:#fff; }
    .refresh { background:#f05a00; color:#fff; }
    .outline { background:#222; color:#fff; border:1px solid #444; }
    .item { display:flex; justify-content:space-between; gap:12px; align-items:center; background:#050505; border:1px solid #333; border-radius:16px; padding:12px; margin:8px 0; }
    .phrase { font-size:16px; }
    .meta { color:#aaa; font-size:12px; margin-top:4px; }
    .status { color:#ffb37c; min-height:22px; }
    .insights-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin:16px 0; }
    .stat { background:#050505; border:1px solid #333; border-radius:18px; padding:14px; }
    .stat-label { color:#aaa; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .stat-value { font-size:30px; font-weight:800; margin-top:8px; }
    table { width:100%; border-collapse:collapse; margin-top:16px; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #2b2b2b; font-size:14px; }
    th { color:#aaa; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  </style>
</head>
<body>
  <main>
    <a href="/">← Volver al generador</a>
    <h1>Admin moderation</h1>
    <p>Approve or reject user-submitted phrases.</p>

    <div class="card">
      <h2>Admin token</h2>
      <input id="token" type="password" placeholder="Paste ADMIN_TOKEN from Netlify environment variables" />
      <button class="refresh" onclick="saveToken()">Save token</button>
      <button class="outline" onclick="loadData()">Refresh</button>
      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <h2>Usage insights</h2>
      <div id="insightsMeta" class="meta"></div>
      <div id="insightsSummary" class="insights-grid"></div>
      <div id="insightsToday" class="meta"></div>
      <div id="insightsDays"></div>
    </div>

    <div class="card">
      <h2>Pending phrases</h2>
      <div id="pending"></div>
    </div>

    <div class="card">
      <h2>Approved phrases</h2>
      <div id="approved"></div>
    </div>
  </main>

  <script>
    const tokenInput = document.getElementById("token");
    tokenInput.value = localStorage.getItem("adminToken") || "";

    function saveToken() {
      localStorage.setItem("adminToken", tokenInput.value.trim());
      setStatus("Token saved locally in this browser.");
      loadData();
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    async function api(path, options = {}) {
      const token = tokenInput.value.trim();
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("es-MX").format(value || 0);
    }

    function renderInsights(insights) {
      const summary = document.getElementById("insightsSummary");
      const meta = document.getElementById("insightsMeta");
      const today = document.getElementById("insightsToday");
      const days = document.getElementById("insightsDays");

      summary.innerHTML = "";
      days.innerHTML = "";

      if (!insights) {
        meta.textContent = "No usage data yet.";
        today.textContent = "";
        return;
      }

      const stats = [
        ["Views", insights.totals.views],
        ["Generates", insights.totals.generates],
        ["Shares", insights.totals.shares],
        ["Downloads", insights.totals.downloads],
        ["Copies", insights.totals.copies],
        ["Suggestions", insights.totals.suggestionsSubmitted],
        ["Pending", insights.totals.pendingPhrases],
        ["Approved", insights.totals.approvedPhrases]
      ];

      for (const [label, value] of stats) {
        const card = document.createElement("div");
        card.className = "stat";
        card.innerHTML = `<div class="stat-label">${label}</div><div class="stat-value">${formatNumber(value)}</div>`;
        summary.appendChild(card);
      }

      meta.textContent = insights.lastUpdatedAt
        ? `Last activity: ${new Date(insights.lastUpdatedAt).toLocaleString("es-MX")}`
        : "No tracked activity yet.";

      today.textContent = `Today: ${formatNumber(insights.today.views)} views, ${formatNumber(insights.today.generates)} generates, ${formatNumber(insights.today.shares + insights.today.downloads + insights.today.copies)} share/download/copy actions, ${formatNumber(insights.today.suggestionsSubmitted)} suggestions, ${formatNumber(insights.today.approvals + insights.today.rejections)} moderation actions.`;

      if (!insights.recentDays || insights.recentDays.length === 0) return;

      const table = document.createElement("table");
      table.innerHTML = `
        <thead>
          <tr>
            <th>Date</th>
            <th>Views</th>
            <th>Generates</th>
            <th>Shares</th>
            <th>Downloads</th>
            <th>Copies</th>
            <th>Suggestions</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;

      const tbody = table.querySelector("tbody");
      for (const item of insights.recentDays) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.date}</td>
          <td>${formatNumber(item.views)}</td>
          <td>${formatNumber(item.generates)}</td>
          <td>${formatNumber(item.shares)}</td>
          <td>${formatNumber(item.downloads)}</td>
          <td>${formatNumber(item.copies)}</td>
          <td>${formatNumber(item.suggestionsSubmitted)}</td>
        `;
        tbody.appendChild(row);
      }

      days.appendChild(table);
    }

    function renderList(elementId, items, kind) {
      const el = document.getElementById(elementId);
      el.innerHTML = "";

      if (!items || items.length === 0) {
        el.innerHTML = "<p>No items.</p>";
        return;
      }

      for (const item of items) {
        const div = document.createElement("div");
        div.className = "item";

        const text = document.createElement("div");
        text.innerHTML = `<div class="phrase"></div><div class="meta">${item.createdAt || ""}</div>`;
        text.querySelector(".phrase").textContent = item.phrase;

        const actions = document.createElement("div");

        if (kind === "pending") {
          const approve = document.createElement("button");
          approve.className = "approve";
          approve.textContent = "Approve";
          approve.onclick = () => moderate(item.id, "approve");

          const reject = document.createElement("button");
          reject.className = "reject";
          reject.textContent = "Reject";
          reject.onclick = () => moderate(item.id, "reject");

          actions.appendChild(approve);
          actions.appendChild(reject);
        } else {
          const del = document.createElement("button");
          del.className = "reject";
          del.textContent = "Delete";
          del.onclick = () => moderate(item.id, "deleteApproved");
          actions.appendChild(del);
        }

        div.appendChild(text);
        div.appendChild(actions);
        el.appendChild(div);
      }
    }

    async function loadData() {
      try {
        setStatus("Loading...");
        const data = await api("/api/moderate");
        renderInsights(data.insights);
        renderList("pending", data.pending, "pending");
        renderList("approved", data.approved, "approved");
        setStatus("Loaded.");
      } catch (error) {
        setStatus("Error: " + error.message);
      }
    }

    async function moderate(id, action) {
      try {
        setStatus("Saving...");
        await api("/api/moderate", {
          method: "POST",
          body: JSON.stringify({ id, action })
        });
        await loadData();
      } catch (error) {
        setStatus("Error: " + error.message);
      }
    }

    if (tokenInput.value) loadData();
  </script>
</body>
</html>
